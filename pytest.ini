[pytest]
# 发版前条件（不参与打包闸门）：归因文档验收门 docgate、界面层验收门 uigate、
# 发布产物一致性 releasegate。默认闸门只跑"随时可跑"的部分；发版前须逐个单独执行：
#     python -X utf8 -m pytest tests -m docgate    -q
#     python -X utf8 -m pytest tests -m uigate     -q
#     python -X utf8 -m pytest tests -m releasegate -q
addopts = -m "not docgate and not uigate and not releasegate"
markers =
    docgate: 归因文档验收门（R16/R19/R21/R23），发版前条件
    uigate: 界面层验收门（SL1–SL4），发版前条件
    releasegate: 发布产物一致性验收（入口条件 7），发版前条件
    realdata: 需要真实工作簿的回归用例；文件缺失时自动跳过
